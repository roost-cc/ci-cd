name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The release runner unconditionally requires syft, cosign, and gh on PATH.
      # gh is preinstalled on GitHub-hosted runners; provision the other two here.
      # Self-hosted runners must bake these tools into their image instead.
      - uses: anchore/sbom-action/download-syft@v0
      - uses: sigstore/cosign-installer@v3
      - run: git clone --depth=1 --branch v1 https://example.invalid/ci-cd.git .ci-cd
      - run: mkdir -p "$RUNNER_TEMP/release-assets"
      # A tag push does not create a GitHub Release, and `gh release upload`
      # will not create one either. Create it (idempotently) before the runner
      # uploads the artifacts, SBOM, signatures, and certificates.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
      - env:
          # gh release upload is not ambiently authenticated on GitHub Actions;
          # map the job token in so the runner can publish to the Release.
          GH_TOKEN: ${{ github.token }}
          CI_EVENT: tag
          CI_REF: ${{ github.ref }}
          CI_REF_NAME: ${{ github.ref_name }}
          CI_TAG: ${{ github.ref_name }}
          CI_RELEASE_NAME: ${{ github.ref_name }}
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_ARTIFACTS_DIR: ${{ runner.temp }}/release-assets
          CI_PLATFORM: linux/amd64
        run: |
          export CI_OIDC_TOKEN="${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          ./.ci-cd/bin/ci run release --platform linux/amd64
